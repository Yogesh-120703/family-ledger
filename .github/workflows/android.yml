# Builds the Family Ledger Android app (APK) on GitHub's servers.
# The APK is attached to a GitHub Release, so it downloads on a phone without signing in.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 24.04 images come with the Android SDK already installed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then echo "::error::Android SDK not found on this build machine"; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Install packages
        run: npm ci

      - name: Copy app screens into the Android project
        run: npm run sync

      - name: Run text-rule tests
        run: npm run test:upi

      - name: Use the project's fixed signing key
        # Same key for every build, so each new APK installs over the old one and keeps your data.
        run: |
          mkdir -p ~/.android
          cp android/signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        working-directory: android
        run: |
          if [ -f build.log ]; then
            grep -nE "error:|FAILURE|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk family-ledger.apk

      - name: Check the APK with Android's own tools
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs family-ledger.apk > verify.txt 2>&1 && echo "::notice::apksigner: $(grep -E 'Verifies|v1 scheme|v2 scheme|v3 scheme' verify.txt | tr '\n' ' ')" || { echo "::error::apksigner failed: $(head -5 verify.txt | tr '\n' ' ')"; exit 1; }
          "$BT/aapt2" dump badging family-ledger.apk > badging.txt
          echo "::notice::badging: $(grep -E "^package:|sdkVersion|targetSdkVersion|native-code|testOnly" badging.txt | tr '\n' ' ')"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: family-ledger-apk
          path: family-ledger.apk

      - name: Publish APK download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" family-ledger.apk \
            --repo "${{ github.repository }}" \
            --title "Family Ledger (build ${{ github.run_number }})" \
            --notes "Install on Android: download family-ledger.apk, open it, allow installing from this source. Test build (debug), not for the Play Store." \
            --latest
